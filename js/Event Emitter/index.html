<body>
    <div class="editor">
    <div class="editor-header">
        Eventemitter Implementation from Scratch
    </div>
    <textarea spellcheck="false">
        class EventEmitter {
            constructor() {
                this.events = new Map();
            }

            /*
                ON - register the events ,
                Case1 : if event_name exist, add into it's event_handler array
                case2: if event_name  doesn't exist, register the event_name as well as it's handler
                */

            on(event_name, event_handler) {
                if (this.events.has(event_name)) {
                    this.events.get(event_name).push(event_handler);
                } else {
                    this.events.set(event_name, [event_handler]);
                }
                return this;
            }

            /*
                Off - remove specific event_handler from event_name
                case1: if event_name doesn't exist do nothing
                case2: if event_handler doesn't exist do nothing
                */
            off(event_name, event_handler) {
                if (!this.events.has(event_name)) return this;
                const event_handlers = this.events.get(event_name);

                //already checking through index
                // if(this.events.has(event_name) && !event_handlers.includes(event_handler) ) return;

                const handler_index = event_handlers.indexOf(event_handler);
                if (handler_index === -1) return this;

                /*
                      initially, using delete handerler[handler]
                      which results in [handler1, empty, handler3] - sparse array
                      */
                event_handlers.splice(handler_index, 1);

                return this;
            }

            /*
                emit - user to execute the listeners agaist thier event_name with payloads
                */
            emit(event_name, ...payload) {
                const event_handlers = this.events.get(event_name);
                if (!event_handlers) return;

                [...event_handlers].forEach((event_handler) => {
                    event_handler(...payload);
                });

                return this;
            }

            /*
                once - it will execute the listener once only and then remove it 
                */

            once(event_name, event_handler) {
                const wrapper = (...payload) => {
                    this.off(event_name, wrapper);
                    event_handler(...payload);
                };

                this.on(event_name, wrapper);

                return this;
            }
        }
    </textarea>

    <script>

            off(event_name, event_handler) {

                //already checking through index

                const handler_index = event_handlers.indexOf(event_handler);
                if (handler_index === -1) return this;

                /*
                      initially, using delete handerler[handler]
                      which results in [handler1, empty, handler3] - sparse array
                      */
                event_handlers.splice(handler_index, 1);

                return this;
            }

            /*
                emit - user to execute the listeners agaist thier event_name with payloads
                */
            emit(event_name, ...payload) {
                const event_handlers = this.events.get(event_name);
                if (!event_handlers) return;

                [...event_handlers].forEach((event_handler) => {
                    event_handler(...payload);
                });

                return this;
            }

            /*
                once - it will execute the listener once only and then remove it 
                */

            once(event_name, event_handler) {
                const wrapper = (...payload) => {
                    this.off(event_name, wrapper);
                    event_handler(...payload);
                };

                this.on(event_name, wrapper);

                return this;
            }
        }

        console.log("TEST 1");

        const emitter1 = new EventEmitter();

        emitter1.on("data", (...args) => {
            console.log("Listener 1:", args);
        });

        emitter1.emit("data", "A", "B");

        console.log("TEST 2");

        const emitter2 = new EventEmitter();

        emitter2.on("data", () => {
            console.log("Listener A");
        });

        emitter2.on("data", () => {
            console.log("Listener B");
        });

        emitter2.emit("data");

        console.log("TEST 3");

        const emitter3 = new EventEmitter();

        emitter3.on("login", () => {
            console.log("LOGIN");
        });

        emitter3.on("logout", () => {
            console.log("LOGOUT");
        });

        emitter3.emit("login");

        console.log("TEST 4");

        const emitter4 = new EventEmitter();

        const handlerA = () => {
            console.log("A");
        };

        const handlerB = () => {
            console.log("B");
        };

        emitter4.on("data", handlerA);

        emitter4.on("data", handlerB);

        emitter4.off("data", handlerA);

        emitter4.emit("data");
